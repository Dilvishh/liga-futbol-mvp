<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Mesa - Liga de Estrellas Doradas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-16">

    <!-- Cabecera -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <h1 class="text-base font-bold text-amber-400">⚙️ Panel de Control (Mesa)</h1>
            <a href="/" class="text-xs text-slate-400 hover:text-white border border-slate-700 px-2.5 py-1 rounded">
                Ir a la Web Pública ↗
            </a>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 mt-6 space-y-6">

        <!-- 1. CREAR EQUIPO -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-4">
            <h2 class="text-sm font-bold text-slate-200 mb-3 flex items-center gap-2">
                🛡️ Registrar Nuevo Equipo
            </h2>
            <form action="/admin/equipos/crear" method="POST" class="flex gap-2">
                <input type="text" name="nombre" placeholder="Nombre del club" required
                    class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
                <button type="submit" 
                    class="bg-amber-400 hover:bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition">
                    Guardar
                </button>
            </form>
        </section>

        <!-- 2. INSCRIBIR JUGADOR -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-4">
            <h2 class="text-sm font-bold text-slate-200 mb-3 flex items-center gap-2">
                👤 Inscribir Jugador
            </h2>
            <form action="/admin/jugadores/crear" method="POST" class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400">Equipo</label>
                    <select name="equipo_id" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400 mt-1">
                        {% for eq in equipos %}
                        <option value="{{ eq.id }}">{{ eq.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-2">
                        <label class="text-xs text-slate-400">Nombre Completo</label>
                        <input type="text" name="nombre" placeholder="Ej: Juan Soto" required
                            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400 mt-1">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">N° Camiseta</label>
                        <input type="number" name="numero" placeholder="10"
                            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400 mt-1">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-slate-400">Posición</label>
                    <select name="posicion" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400 mt-1">
                        <option value="Arquero">Arquero</option>
                        <option value="Defensa">Defensa</option>
                        <option value="Mediocampista">Mediocampista</option>
                        <option value="Delantero">Delantero</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-bold py-2 rounded-lg text-sm transition">
                    Inscribir en Plantel
                </button>
            </form>
        </section>

        <!-- 3. PROGRAMAR PARTIDO -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-4">
            <h2 class="text-sm font-bold text-slate-200 mb-3 flex items-center gap-2">
                📅 Programar Encuentro
            </h2>
            <form action="/admin/partidos/crear" method="POST" class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-slate-400">Local</label>
                        <select name="local_id" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400 mt-1">
                            {% for eq in equipos %}
                            <option value="{{ eq.id }}">{{ eq.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">Visita</label>
                        <select name="visita_id" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400 mt-1">
                            {% for eq in equipos %}
                            <option value="{{ eq.id }}">{{ eq.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-bold py-2 rounded-lg text-sm transition">
                    Crear Partido
                </button>
            </form>
        </section>

        <!-- 4. REGISTRAR RESULTADO DE PARTIDO -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-4">
            <h2 class="text-sm font-bold text-slate-200 mb-3 flex items-center gap-2">
                📝 Cargar Resultado Final
            </h2>
            <div class="space-y-3">
                {% for p in partidos %}
                <form action="/admin/partidos/{{ p.id }}/finalizar" method="POST" class="bg-slate-950 p-3 rounded-lg border border-slate-800">
                    <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
                        <span>Partido #{{ p.id }}</span>
                        <span class="px-2 py-0.5 rounded font-bold {% if p.estado == 'FINALIZADO' %}text-slate-400 bg-slate-800{% else %}text-blue-400 bg-blue-500/20{% endif %}">
                            {{ p.estado }}
                        </span>
                    </div>
                    <div class="grid grid-cols-5 items-center gap-2">
                        <span class="col-span-2 text-right text-xs font-semibold text-slate-200 truncate">{{ p.local.nombre }}</span>
                        <div class="flex items-center justify-center gap-1">
                            <input type="number" name="goles_local" value="{{ p.goles_local }}" min="0" required
                                class="w-8 text-center bg-slate-900 border border-slate-700 rounded py-1 text-sm font-bold text-amber-400">
                            <span class="text-slate-500">-</span>
                            <input type="number" name="goles_visita" value="{{ p.goles_visita }}" min="0" required
                                class="w-8 text-center bg-slate-900 border border-slate-700 rounded py-1 text-sm font-bold text-amber-400">
                        </div>
                        <span class="col-span-2 text-left text-xs font-semibold text-slate-200 truncate">{{ p.visita.nombre }}</span>
                    </div>
                    <button type="submit" class="w-full mt-3 bg-amber-400 hover:bg-amber-500 text-slate-950 font-bold py-1.5 rounded text-xs transition">
                        Guardar Marcador
                    </button>
                </form>
                {% endfor %}
            </div>
        </section>

    </main>
</body>
</html>
