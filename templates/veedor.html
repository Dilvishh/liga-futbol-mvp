<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veedor - Partidos de la Fecha</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121620] text-slate-100 min-h-screen font-sans pb-20">

    <!-- Top Bar -->
    <header class="bg-[#1a202c] border-b border-slate-800 p-4 sticky top-0 z-50 flex items-center justify-between">
        <h1 class="text-sm font-bold text-amber-400 uppercase tracking-wide">🏆 Copa Libertadores 2026</h1>
        <a href="/" class="text-xs text-slate-400 hover:text-white border border-slate-700 px-2 py-1 rounded">Tabla</a>
    </header>

    <main class="max-w-md mx-auto px-3 mt-4 space-y-3">
        <div class="text-xs font-semibold text-slate-400 px-1 uppercase tracking-wider">Fecha 1 — Grupo A</div>

        {% for p in partidos %}
        <!-- Tarjeta de partido clicable que lleva al centro de partido -->
        <a href="/partido/{{ p.id }}" class="block bg-[#1a2130] border border-slate-800 hover:border-slate-600 rounded-xl p-3.5 transition shadow-sm">
            <div class="flex items-center justify-between text-[11px] text-slate-400 mb-2">
                <span>Partido #{{ p.id }}</span>
                <span class="px-2 py-0.5 rounded font-bold {% if p.estado == 'FINALIZADO' %}bg-slate-800 text-slate-300{% else %}bg-emerald-500/20 text-emerald-400{% endif %}">
                    {{ p.estado }}
                </span>
            </div>
            
            <div class="grid grid-cols-5 items-center gap-2">
                <div class="col-span-2 flex items-center justify-end gap-2 text-right">
                    <span class="font-bold text-sm text-slate-200 truncate">{{ p.local.nombre }}</span>
                    <div class="w-7 h-7 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs">🛡️</div>
                </div>
                
                <div class="flex items-center justify-center">
                    <span class="bg-[#0f131a] px-3 py-1 rounded-lg font-black text-amber-400 text-base tracking-wider border border-slate-800">
                        {{ p.goles_local }} - {{ p.goles_visita }}
                    </span>
                </div>

                <div class="col-span-2 flex items-center justify-start gap-2 text-left">
                    <div class="w-7 h-7 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs">🛡️</div>
                    <span class="font-bold text-sm text-slate-200 truncate">{{ p.visita.nombre }}</span>
                </div>
            </div>
        </a>
        {% endfor %}
    </main>

    <!-- Barra inferior tipo app nativa -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#161b26] border-t border-slate-800 p-2 flex justify-around text-xs">
        <a href="/veedor" class="flex flex-col items-center text-amber-400 font-bold">
            <span>📋</span><span>Veedor</span>
        </a>
        <a href="/" class="flex flex-col items-center text-slate-400">
            <span>📊</span><span>Posiciones</span>
        </a>
        <a href="/admin" class="flex flex-col items-center text-slate-400">
            <span>⚙️</span><span>Admin</span>
        </a>
    </nav>
    <!-- BOTTOM NAVIGATION BAR (APP NATIVA) -->
<nav class="fixed bottom-0 left-0 right-0 bg-[#0d121d]/90 backdrop-blur-lg border-t border-slate-800/80 px-6 py-2.5 z-50">
    <div class="max-w-md mx-auto flex items-center justify-between text-center">
        
        <!-- 1. Inicio -->
        <a href="/" class="flex flex-col items-center flex-1 transition {% if pagina_activa == 'inicio' %}text-amber-400{% else %}text-slate-400 hover:text-slate-200{% endif %}">
            <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            <span class="text-[10px] font-bold tracking-tight">Inicio</span>
        </a>

        <!-- 2. Ligas (Estadísticas y Posiciones) -->
        <a href="/estadisticas" class="flex flex-col items-center flex-1 transition {% if pagina_activa == 'ligas' %}text-amber-400{% else %}text-slate-400 hover:text-slate-200{% endif %}">
            <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
            <span class="text-[10px] font-bold tracking-tight">Ligas</span>
        </a>

        <!-- 3. Equipos -->
        <a href="/equipos" class="flex flex-col items-center flex-1 transition {% if pagina_activa == 'equipos' %}text-amber-400{% else %}text-slate-400 hover:text-slate-200{% endif %}">
            <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
            </svg>
            <span class="text-[10px] font-bold tracking-tight">Equipos</span>
        </a>

        <!-- 4. Login (Veedor / Admin) -->
        <a href="/admin" class="flex flex-col items-center flex-1 transition {% if pagina_activa == 'login' %}text-amber-400{% else %}text-slate-400 hover:text-slate-200{% endif %}">
            <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <span class="text-[10px] font-bold tracking-tight">Login</span>
        </a>

    </div>
</nav>
</body>
</html>
